# ==============================================================================
#  localai.conf — LocalAI Unified Configuration & Memory Profile
# ==============================================================================
#  HOW IT WORKS:
#    1. Quick Profile Mode: Set MEMORY_STRATEGY under [memory] to automatically
#       apply baseline VRAM/RAM optimizations ('aggressive_release',
#       'balanced_caching', or 'high_performance_pinned').
#    2. Fine-Tuning Mode: Any explicit KEY=VALUE parameter defined under a tool
#       section ([ollama], [comfyui], etc.) overrides the baseline strategy.
#
#  CLI Shortcut:
#    localai.sh config show
#    localai.sh config profile <aggressive|balanced|performance>
# ==============================================================================

# ─── Global Memory Strategy & Cleanup Hooks ───────────────────────────────────
[memory]
# Profiles:
#   - aggressive_release      : Immediate VRAM/RAM offload, 8GB VRAM guards, TCMalloc
#   - balanced_caching        : 5m model retention in VRAM, smart caching
#   - high_performance_pinned : Models stay pinned in VRAM/RAM (for 16GB+ VRAM)
MEMORY_STRATEGY=aggressive_release

# Automatically clean VRAM and shared memory when a service stops (localai.sh stop)
AUTO_CLEAN_ON_STOP=true

# Attempt host system filesystem cache drop (sync && drop_caches) during memory clean
AUTO_DROP_CACHES=false


# ─── Ollama Configuration ─────────────────────────────────────────────────────
[ollama]
OLLAMA_HOST=0.0.0.0:11434

# Unload model from VRAM/RAM immediately after request finishes (0 = immediate, 5m = default)
OLLAMA_KEEP_ALIVE=0

# Limit parallel context slots to prevent VRAM scaling
OLLAMA_NUM_PARALLEL=1

# Flash Attention (reduces KV-cache VRAM usage and speeds up generation)
OLLAMA_FLASH_ATTENTION=1

# Limit simultaneously loaded models in VRAM to 1
OLLAMA_MAX_LOADED_MODELS=1

# 8-bit KV-Cache quantization (halves context VRAM usage with negligible quality loss)
OLLAMA_KV_CACHE_TYPE=q8_0

# Reserve 512 MB (536870912 bytes) VRAM for desktop/display server to prevent CUDA OOMs on 8GB GPUs
OLLAMA_GPU_OVERHEAD=536870912

# TCMalloc allocator optimization (prevents RAM bloat and fragmentation)
LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4


# ─── ComfyUI Configuration ────────────────────────────────────────────────────
[comfyui]
COMFYUI_HOST=0.0.0.0
COMFYUI_PORT=8188

# TCMalloc memory allocator
LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4

# PyTorch CUDA Allocator Fine-Tuning (prevents fragmentation OOMs on 8GB VRAM)
PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:128"

# Model unloading & memory cleanup for Florence-2 and vision nodes
FLORENCE2_UNLOAD_IMMEDIATE=1

# ComfyUI launch arguments:
# --disable-smart-memory : Offloads models from VRAM immediately after node execution
# --reserve-vram 0.3     : Reserves 300 MB VRAM for the host OS/desktop environment
# --preview-method auto  : Minimal memory footprint during generation previews
# --enable-triton-backend: Memory-efficient attention kernels on Linux
COMFYUI_EXTRA_ARGS="--disable-smart-memory --reserve-vram 0.3 --preview-method auto --enable-triton-backend"


# ─── Open WebUI Configuration ─────────────────────────────────────────────────
[openwebui]
PORT=8080
HOST=0.0.0.0
OLLAMA_BASE_URL=http://127.0.0.1:11434

# Keep Open WebUI internal RAG/embeddings on CPU so 100% of GPU VRAM stays free for Ollama
DEVICE_TYPE=cpu
USE_CUDA_DOCKER=false

# Optional settings (remove '#' to enable):
# WEBUI_AUTH=false
# ENABLE_SIGNUP=true


# ─── IOPaint Configuration (Image Inpainting & Object Removal) ────────────────
[iopaint]
IOPAINT_PORT=8082
IOPAINT_HOST=0.0.0.0
IOPAINT_MODEL=lama
IOPAINT_DEVICE=cuda
LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4
PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True,garbage_collection_threshold:0.8,max_split_size_mb:128"
IOPAINT_EXTRA_ARGS="--low-mem"


# ─── Whisper Configuration (Speech-to-Text / Speaches) ────────────────────────
[whisper]
WHISPER_HOST=0.0.0.0
WHISPER_PORT=8083
# Unload STT model immediately after transcription (0 = immediate, 300 = 5m)
WHISPER_TTL=0
WHISPER_DEVICE=cuda
WHISPER_COMPUTE_TYPE=int8
LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4
