# ==============================================================================
#  localai.conf — Local AI Environment Manager Configuration
# ==============================================================================
#  This file allows you to customize runtime options and parameters for tools
#  managed by localai.sh without modifying the script files directly.
# ==============================================================================

# ─── Ollama Configuration ─────────────────────────────────────────────────────
[ollama]
OLLAMA_HOST=0.0.0.0:11434

# Most commonly used Ollama parameters (remove the '#' to enable):
# OLLAMA_KEEP_ALIVE=24h         # How long to keep models in memory (e.g., 5m, 1h, -1 for always)
# OLLAMA_NUM_PARALLEL=4         # Maximum number of parallel requests/models
# OLLAMA_MAX_LOADED_MODELS=2    # Maximum number of models to keep in VRAM concurrently
# OLLAMA_FLASH_ATTENTION=1      # Enable Flash Attention (Faster generation, less VRAM usage)
# OLLAMA_ORIGINS="*"            # CORS configuration (Useful for remote API access)
# OLLAMA_MAX_VRAM=8192          # Maximum VRAM limit for Ollama to use (in MB)

# ─── ComfyUI Configuration ────────────────────────────────────────────────────
[comfyui]
COMFYUI_HOST=0.0.0.0
COMFYUI_PORT=8188

# Most commonly used ComfyUI launch arguments (add them together in COMFYUI_EXTRA_ARGS):
# --lowvram                 : Optimizes VRAM usage for GPUs with less than 8GB VRAM
# --highvram                : Keeps models in VRAM for faster generation (Requires 16GB+ VRAM)
# --normalvram              : Default profile (Best for most users)
# --cpu                     : Run on CPU only (For systems without a dedicated GPU)
# --enable-triton-backend   : Nvidia GPU acceleration on Linux (xformers alternative)
# --preview-method auto     : Show fast generation previews in the web UI
# --disable-cuda-malloc     : Try this if you are getting OOM (Out Of Memory) errors

# Example 1 (Nvidia GPU with Low VRAM):
# COMFYUI_EXTRA_ARGS="--lowvram --preview-method auto --enable-triton-backend"

# Example 2 (CPU Only):
# COMFYUI_EXTRA_ARGS="--cpu"

# Active extra arguments (Default is empty, ComfyUI uses its own hardware detection):
# COMFYUI_EXTRA_ARGS=

# ─── Open WebUI Configuration ──────────────────────────────────────────────────
[openwebui]
PORT=8080
HOST=0.0.0.0
OLLAMA_BASE_URL=http://127.0.0.1:11434

# Optional configuration settings (remove the '#' to enable):
# WEBUI_AUTH=false              # Disable admin/user login authentication requirement
# ENABLE_SIGNUP=true            # Enable or disable new user signups

